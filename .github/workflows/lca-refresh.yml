name: Automated DOL LCA Quarterly Data Ingestion

on:
  schedule:
    - cron: '0 4 * * *' # Run daily at 04:00 UTC
  workflow_dispatch:
    inputs:
      force_import:
        description: 'Force import even if quarter has already been imported'
        required: false
        type: boolean
        default: false

concurrency:
  group: 'lca-refresh'
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  lca-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Check for New DOL Quarterly Release
        id: check_dol
        run: |
          mkdir -p tmp
          FORCE_FLAG=""
          if [ "${{ inputs.force_import }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          node scripts/fetch-lca.mjs $FORCE_FLAG

      - name: Download New Quarterly XLSX
        if: steps.check_dol.outputs.has_new_data == 'true'
        run: |
          echo "New quarterly data detected: ${{ steps.check_dol.outputs.file_name }}"
          node scripts/download-lca.mjs "${{ steps.check_dol.outputs.download_url }}"

      - name: Process & Aggregate Employer Statistics
        if: steps.check_dol.outputs.has_new_data == 'true'
        run: |
          node scripts/process-lca-cache.mjs "./tmp/${{ steps.check_dol.outputs.file_name }}"

      - name: Validate Generated Aggregation Payload
        if: steps.check_dol.outputs.has_new_data == 'true'
        run: |
          node -e "
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('./tmp/lca-aggregated-cache.json', 'utf-8'));
          if (!Array.isArray(data) || data.length === 0) throw new Error('Aggregation payload is empty or invalid.');
          const sample = data[0];
          if (!sample.employerName || !sample.slug || typeof sample.totalLCAs !== 'number') {
            throw new Error('Required employer fields missing from aggregated record.');
          }
          console.log('Payload validation passed: ' + data.length + ' valid employer records ready.');
          "

      - name: Ingest to Production PostgreSQL
        if: steps.check_dol.outputs.has_new_data == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          node scripts/import-lca.mjs ./tmp/lca-aggregated-cache.json

      - name: Update State Manifest and Commit
        if: steps.check_dol.outputs.has_new_data == 'true'
        run: |
          node -e "
          const fs = require('fs');
          const path = './src/content/lca-manifest.json';
          const cache = JSON.parse(fs.readFileSync('./tmp/lca-aggregated-cache.json', 'utf-8'));
          const manifest = {
            latestImportedFiscalYear: parseInt(process.env.FY, 10),
            latestImportedQuarter: parseInt(process.env.QUARTER, 10),
            latestImportedFile: process.env.FILE_NAME,
            recordCount: cache.length,
            lastImportedAt: new Date().toISOString()
          };
          fs.writeFileSync(path, JSON.stringify(manifest, null, 2));
          "
          git config user.name "lca-refresh-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/content/lca-manifest.json
          if git diff --cached --quiet; then
            echo "Manifest unchanged — skipping commit."
          else
            git commit -m "chore: record DOL LCA FY${{ steps.check_dol.outputs.fy }}-Q${{ steps.check_dol.outputs.quarter }} import"
            git push origin HEAD:${{ github.ref_name }}
          fi
        env:
          FY: ${{ steps.check_dol.outputs.fy }}
          QUARTER: ${{ steps.check_dol.outputs.quarter }}
          FILE_NAME: ${{ steps.check_dol.outputs.file_name }}

      - name: Trigger Cloudflare Pages deploy (optional backup)
        if: steps.check_dol.outputs.has_new_data == 'true' && env.CF_DEPLOY_HOOK != ''
        env:
          CF_DEPLOY_HOOK: ${{ secrets.CF_DEPLOY_HOOK }}
        run: curl -X POST "$CF_DEPLOY_HOOK"

      - name: Archive Aggregation Cache Artifact
        if: steps.check_dol.outputs.has_new_data == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lca-aggregated-cache
          path: tmp/lca-aggregated-cache.json
          retention-days: 14

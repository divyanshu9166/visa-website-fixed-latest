name: Quarterly DOL LCA Data Import

on:
  schedule:
    - cron: '0 0 5 1,4,7,10 *'
  workflow_dispatch:
    inputs:
      force_import:
        description: Force import even if the quarter is already recorded
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: lca-refresh
  cancel-in-progress: false

jobs:
  import-lca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Discover latest disclosure
        id: discover
        run: node scripts/fetch-lca.mjs ${{ inputs.force_import == true && '--force' || '' }}
      - name: Download disclosure
        if: steps.discover.outputs.has_new_data == 'true'
        run: node scripts/download-lca.mjs "${{ steps.discover.outputs.download_url }}"
      - name: Stream and aggregate disclosure
        if: steps.discover.outputs.has_new_data == 'true'
        run: node scripts/process-lca-cache.mjs "tmp/${{ steps.discover.outputs.file_name }}"
      - name: Validate aggregation
        if: steps.discover.outputs.has_new_data == 'true'
        run: node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('tmp/lca-aggregated-cache.json'));if(!Array.isArray(d)||!d.length||d.some(x=>!x.employerName||!Number.isInteger(x.totalLCAs)))process.exit(1);console.log('Validated '+d.length+' employers')"
      - name: Import to PostgreSQL
        if: steps.discover.outputs.has_new_data == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/import-lca.mjs tmp/lca-aggregated-cache.json
      - name: Update manifest and commit
        if: steps.discover.outputs.has_new_data == 'true'
        env:
          FY: ${{ steps.discover.outputs.fy }}
          QUARTER: ${{ steps.discover.outputs.quarter }}
          FILE_NAME: ${{ steps.discover.outputs.file_name }}
        run: |
          node -e "const fs=require('fs');fs.writeFileSync('src/content/lca-manifest.json',JSON.stringify({latestImportedFiscalYear:Number(process.env.FY),latestImportedQuarter:Number(process.env.QUARTER),latestImportedFile:process.env.FILE_NAME,recordCount:JSON.parse(fs.readFileSync('tmp/lca-aggregated-cache.json')).length,lastImportedAt:new Date().toISOString()},null,2)+'\\n')"
          git config user.name lca-refresh-bot
          git config user.email actions@users.noreply.github.com
          git add src/content/lca-manifest.json
          git diff --cached --quiet || (git commit -m "chore: import DOL LCA FY${FY}-Q${QUARTER}" && git push origin HEAD:${GITHUB_REF_NAME})
      - uses: actions/upload-artifact@v4
        if: always() && steps.discover.outputs.has_new_data == 'true'
        with:
          name: lca-aggregated-cache
          path: tmp/lca-aggregated-cache.json
          if-no-files-found: ignore
          retention-days: 14

name: Quarterly DOL LCA Data Import

on:
  schedule:
    # Run on the 5th of Jan, Apr, Jul, Oct 
    - cron: '0 0 5 1,4,7,10 *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  import-lca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci
      
      - name: Install parser requirements
        run: npm install xlsx --no-save

      - name: Fetch LCA URL & Download
        run: |
          mkdir -p tmp
          node scripts/fetch-lca.mjs > tmp/fetch-output.txt
          cat tmp/fetch-output.txt
          
          # Grab the download URL
          DOWNLOAD_URL=$(grep "Download URL:" tmp/fetch-output.txt | awk '{print $3}')
          FILE_NAME=$(basename $DOWNLOAD_URL)
          echo "DOWNLOAD_URL=$DOWNLOAD_URL" >> $GITHUB_ENV
          echo "FILE_NAME=$FILE_NAME" >> $GITHUB_ENV
          
          # Download the file
          node scripts/download-lca.mjs $DOWNLOAD_URL

      - name: Parse and Cache 
        # Parses the massive Excel file to memory and outputs a small JSON array.
        # Halts before any production database interaction.
        run: |
          echo "Data downloaded to tmp/${FILE_NAME}"
          node scripts/process-lca-cache.mjs ./tmp/${FILE_NAME}

      - name: Archive JSON Cache Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lca-aggregated-cache
          path: tmp/lca-aggregated-cache.json
          retention-days: 14

      - name: Create Manual Import Reminder Issue
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "Review and import latest quarterly DOL LCA Data",
              body: "The Quarterly LCA fetch workflow has successfully processed `" + process.env.FILE_NAME + "`.\n\nTo update the production database:\n1. Download the `lca-aggregated-cache` JSON artifact from this workflow run.\n2. Run locally:\n   ```bash\n   node scripts/import-lca.mjs <path-to-downloaded-json>\n   ```"
            })
